openapi: 3.0.3
info:
  title: Warta API
  version: 1.0.0
  description: |
    REST API untuk platform artikel Warta: akun dan role, kategori, tag,
    artikel, dan komentar.

    **Autentikasi.** Login atau register menghasilkan `access_token` (JWT,
    berlaku singkat) dan `refresh_token` (berlaku lebih lama, sekali pakai).
    Kirim access token di header `Authorization: Bearer <token>`. Saat access
    token kedaluwarsa, tukar refresh token di `/auth/refresh` untuk mendapat
    pasangan baru. Refresh token lama langsung tidak berlaku; bila dipakai lagi,
    semua sesi akun itu dicabut.

    Endpoint publik tetap bisa dipanggil tanpa token. Namun token yang dikirim
    tapi tidak valid atau kedaluwarsa selalu ditolak dengan 401.

    **Role.** Akun baru selalu `reader` (bisa berkomentar). Admin menaikkannya
    menjadi `author` (bisa menulis artikel) atau `admin`.

    **Verifikasi email.** Register mengirim email berisi tautan
    `APP_URL/verify-email?token=...`; frontend meneruskan token itu ke
    `/auth/verify-email`. Bila `REQUIRE_EMAIL_VERIFICATION` aktif (bawaan di
    production), akun yang belum terverifikasi ditolak saat berkomentar atau
    melapor dengan kode `email_not_verified`. Lupa password bekerja serupa
    lewat `APP_URL/reset-password?token=...`.

    **Bentuk response.** Sukses: `{"data": ...}`, ditambah `meta` untuk daftar
    berhalaman. Gagal: `{"error": {"code", "message", "fields"}}`.
servers:
  - url: /
    description: Server yang sedang menyajikan dokumen ini

# Bawaannya token opsional; operasi yang wajib login menimpanya.
security:
  - {}
  - bearerAuth: []

tags:
  - name: Auth
    description: Register, login, refresh, dan logout
  - name: Akun
    description: Data dan artikel milik pengguna yang sedang login
  - name: User
    description: Pengelolaan akun, khusus admin
  - name: Kategori
    description: Satu artikel punya tepat satu kategori
  - name: Tag
    description: Satu artikel punya paling banyak 10 tag
  - name: Artikel
    description: Tulisan dengan status draft, scheduled, published, atau archived, beserta riwayat revisinya
  - name: Komentar
    description: Komentar pembaca pada artikel yang sudah terbit
  - name: Penulis
    description: Profil publik penulis, ikuti, dan artikel dari penulis yang diikuti
  - name: Pencarian
    description: Saran saat mengetik di kotak pencarian
  - name: Interaksi
    description: Suka, bookmark, hitungan dibaca, dan upload gambar sampul
  - name: SEO
    description: Sitemap dan RSS untuk mesin pencari dan pembaca feed
  - name: Health
    description: Pemeriksaan untuk orkestrator dan load balancer

paths:
  /health:
    get:
      operationId: healthLive
      tags: [Health]
      summary: Proses service hidup
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /health/ready:
    get:
      operationId: healthReady
      tags: [Health]
      summary: Service siap melayani (semua ketergantungan terjangkau)
      description: |
        Selalu memeriksa database. Field `redis` dan `storage` hanya muncul
        bila service memakai Redis (`REDIS_URL`) atau object storage
        (`UPLOAD_STORAGE=s3`).
      responses:
        "200":
          description: Siap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Salah satu ketergantungan tidak terjangkau
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }

  /sitemap.xml:
    get:
      operationId: sitemap
      tags: [SEO]
      summary: Sitemap beranda, kategori, dan artikel terbit
      description: Semua tautan menuju frontend (`APP_URL`). Di-cache 15 menit.
      security: [{}]
      responses:
        "200":
          description: OK
          content:
            application/xml:
              schema: { type: string }
  /feed.xml:
    get:
      operationId: rssFeed
      tags: [SEO]
      summary: RSS 2.0 berisi 20 artikel terbit terbaru
      security: [{}]
      responses:
        "200":
          description: OK
          content:
            application/rss+xml:
              schema: { type: string }
  /api/v1/auth/register:
    post:
      operationId: register
      tags: [Auth]
      summary: Membuat akun baru (role reader)
      description: Dibatasi per IP, lihat `AUTH_RATE_LIMIT`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Akun dibuat dan langsung login
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Login dengan email dan password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      summary: Menukar refresh token dengan pasangan token baru
      description: |
        Refresh token lama langsung dicabut. Role di access token baru diambil
        dari database, jadi perubahan role oleh admin berlaku setelah refresh.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Pasangan token baru
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Mencabut refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { description: "Berhasil, juga untuk token yang tidak dikenal" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [Auth]
      summary: Memverifikasi email dengan token dari tautan email
      description: Token berlaku 24 jam dan hanya sekali pakai. Tidak perlu login.
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "200":
          description: Terverifikasi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [Auth]
      summary: Mengirim ulang email verifikasi
      description: Tautan lama tidak berlaku lagi. Paling cepat sekali per menit.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Email dikirim }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [Auth]
      summary: Meminta tautan reset password
      description: |
        Selalu 204, terdaftar atau tidak emailnya, supaya tidak bisa dipakai
        menebak akun. Tautan berlaku 1 jam; permintaan beruntun dalam satu
        menit tidak mengirim email baru.
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "204": { description: Diterima }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      tags: [Auth]
      summary: Membuat password baru dengan token dari email
      description: |
        Token sekali pakai. Semua sesi (refresh token) akun itu dicabut, dan
        emailnya sekaligus dianggap terverifikasi.
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { description: Password diganti }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/me:
    get:
      operationId: getMe
      tags: [Akun]
      summary: Data akun sendiri
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      operationId: updateMe
      tags: [Akun]
      summary: Mengubah nama, bio, atau foto profil
      description: |
        Hanya field yang dikirim yang diubah. Foto profil adalah path hasil
        `POST /api/v1/uploads`; kirim string kosong untuk menghapusnya. Bio
        dan foto tampil di profil publik penulis.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/me/password:
    put:
      operationId: changePassword
      tags: [Akun]
      summary: Mengganti password
      description: Semua refresh token akun ini ikut dicabut.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Berhasil }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/me/articles:
    get:
      operationId: listMyArticles
      tags: [Akun]
      summary: Artikel milik sendiri, semua status
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/TagFilter"
        - $ref: "#/components/parameters/Sort"
        - name: status
          in: query
          schema: { type: string, enum: [draft, scheduled, published, archived, all] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleListEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me/bookmarks:
    get:
      tags: [Akun]
      operationId: listMyBookmarks
      summary: Artikel yang disimpan
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleListEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/me/feed:
    get:
      tags: [Penulis]
      operationId: listMyFeed
      summary: Artikel terbit dari penulis yang diikuti
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleListEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/me/following:
    get:
      tags: [Penulis]
      operationId: listMyFollowing
      summary: Penulis yang diikuti, terbaru diikuti dulu
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AuthorProfile" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/stats:
    get:
      tags: [Akun]
      operationId: getStats
      summary: Statistik dashboard (author dan admin)
      description: Admin melihat semua artikel, author hanya artikelnya sendiri.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 7, maximum: 90, default: 30 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Stats" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/uploads:
    post:
      tags: [Interaksi]
      operationId: uploadImage
      summary: Mengunggah gambar sampul (author dan admin)
      description: |
        JPEG, PNG, WebP, atau GIF, paling besar `MAX_UPLOAD_MB` (bawaan 2 MB).
        Format dikenali dari isi berkas, bukan dari nama atau header. Pakai
        `url` hasilnya sebagai `cover_image` artikel.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
      responses:
        "201":
          description: Tersimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      url: { type: string, example: /uploads/3f2a9c0d4e5b6a7c8d9e0f1a2b3c4d5e.png }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/users:
    get:
      operationId: listUsers
      tags: [User]
      summary: Daftar user
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: q
          in: query
          description: Cari di nama atau email
          schema: { type: string }
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/users/{id}:
    get:
      operationId: getUser
      tags: [User]
      summary: Detail user
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/users/{id}/role:
    patch:
      operationId: updateUserRole
      tags: [User]
      summary: Mengubah role user
      description: Admin tidak bisa mengubah role akunnya sendiri.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRoleRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/authors/{id}:
    get:
      tags: [Penulis]
      operationId: getAuthor
      summary: Profil publik penulis
      description: |
        Tersedia untuk author dan admin, atau siapa pun yang pernah menerbitkan
        artikel. Profil pembaca biasa dibalas 404. Daftar artikelnya ada di
        `GET /api/v1/articles?author={id}`.
      security: [{}, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AuthorProfile" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/authors/{id}/follow:
    put:
      tags: [Penulis]
      operationId: followAuthor
      summary: Mengikuti penulis (idempoten)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/FollowState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Penulis]
      operationId: unfollowAuthor
      summary: Berhenti mengikuti penulis (idempoten)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/FollowState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/search/suggest:
    get:
      tags: [Pencarian]
      operationId: searchSuggest
      summary: Saran saat mengetik
      description: |
        Judul artikel terbit (paling banyak 5), kategori, tag yang dipakai
        artikel terbit, dan penulis. Kata kunci kurang dari dua huruf
        menghasilkan daftar kosong. Boleh di-cache 60 detik.
      security: [{}]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Suggestions" }
  /api/v1/categories:
    get:
      operationId: listCategories
      tags: [Kategori]
      summary: Semua kategori
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
    post:
      operationId: createCategory
      tags: [Kategori]
      summary: Membuat kategori (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryRequest" }
      responses:
        "201":
          description: Dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/categories/{id}:
    get:
      operationId: getCategory
      tags: [Kategori]
      summary: Detail kategori berdasarkan id atau slug
      parameters: [{ $ref: "#/components/parameters/IdOrSlug" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateCategory
      tags: [Kategori]
      summary: Mengubah kategori (admin)
      description: Slug dibuat ulang bila nama berubah.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      operationId: deleteCategory
      tags: [Kategori]
      summary: Menghapus kategori (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Dihapus }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Kategori masih dipakai artikel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/tags:
    get:
      operationId: listTags
      tags: [Tag]
      summary: Daftar tag, diurutkan dari yang paling banyak dipakai
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: q
          in: query
          description: Cari di nama tag
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Tag" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createTag
      tags: [Tag]
      summary: Membuat tag (admin)
      description: Author tidak perlu endpoint ini; tag baru dibuat otomatis saat menulis artikel.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagRequest" }
      responses:
        "201":
          description: Dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/tags/{id}:
    put:
      operationId: updateTag
      tags: [Tag]
      summary: Mengganti nama tag (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      operationId: deleteTag
      tags: [Tag]
      summary: Menghapus tag dan melepasnya dari semua artikel (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Dihapus }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/articles:
    get:
      operationId: listArticles
      tags: [Artikel]
      summary: Daftar artikel
      description: |
        Tanpa `status`, hanya artikel yang sudah terbit yang tampil. Status lain
        (`draft`, `archived`, `all`) hanya untuk admin. Daftar berisi cuplikan
        (`excerpt`), bukan isi lengkap.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/TagFilter"
        - name: author
          in: query
          description: Id penulis
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          schema: { type: string, enum: [draft, scheduled, published, archived, all] }
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleListEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createArticle
      tags: [Artikel]
      summary: Menulis artikel (author atau admin)
      description: |
        Slug dibuat dari judul dan dibuat unik. Tag yang belum ada dibuat
        otomatis; nama tag dirapikan menjadi huruf kecil.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArticleRequest" }
      responses:
        "201":
          description: Dibuat
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/articles/{id}:
    get:
      operationId: getArticle
      tags: [Artikel]
      summary: Detail artikel berdasarkan id atau slug
      description: |
        Artikel yang belum terbit hanya terlihat oleh penulisnya dan admin.
        Bagi yang lain responsnya 404.
      security: [{}, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdOrSlug" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: replaceArticle
      tags: [Artikel]
      summary: Mengganti seluruh isi artikel (penulis atau admin)
      description: |
        Semua field wajib dikirim; `tags` yang tidak dikirim berarti artikel
        tidak punya tag. Slug mengikuti judul hanya selama artikel belum
        pernah terbit.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArticleRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    patch:
      operationId: patchArticle
      tags: [Artikel]
      summary: Mengubah sebagian artikel (penulis atau admin)
      description: Hanya field yang dikirim yang diubah, misalnya `{"status":"published"}`.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArticlePatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      operationId: deleteArticle
      tags: [Artikel]
      summary: Menghapus artikel beserta komentarnya (penulis atau admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Dihapus }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/articles/{id}/like:
    put:
      tags: [Interaksi]
      operationId: likeArticle
      summary: Menyukai artikel terbit (idempoten)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Keadaan terbaru
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Engagement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Interaksi]
      operationId: unlikeArticle
      summary: Membatalkan suka
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Keadaan terbaru
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Engagement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/articles/{id}/bookmark:
    put:
      tags: [Interaksi]
      operationId: bookmarkArticle
      summary: Menyimpan artikel terbit (idempoten)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Keadaan terbaru
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Engagement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Interaksi]
      operationId: unbookmarkArticle
      summary: Menghapus dari simpanan
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Keadaan terbaru
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Engagement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/articles/{id}/view:
    post:
      tags: [Interaksi]
      operationId: recordArticleView
      summary: Mencatat artikel dibaca
      description: |
        Dipanggil halaman baca. Pembaca yang sama (akun, atau IP bila belum
        login) dihitung sekali per 30 menit, dan penulis yang membuka
        artikelnya sendiri tidak dihitung.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Tercatat atau diabaikan sebagai hitungan ganda }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/articles/{id}/revisions:
    get:
      tags: [Artikel]
      operationId: listRevisions
      summary: Riwayat revisi, terbaru dulu (penulis artikel dan admin)
      description: |
        Revisi baru tercatat setiap kali judul, isi, kategori, tag, atau sampul
        berubah; perubahan status saja tidak. Paling banyak 50 revisi terbaru
        disimpan per artikel.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RevisionSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/articles/{id}/revisions/{revision}:
    get:
      tags: [Artikel]
      operationId: getRevision
      summary: Isi lengkap satu revisi
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Revision"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Revision" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/articles/{id}/revisions/{revision}/restore:
    post:
      tags: [Artikel]
      operationId: restoreRevision
      summary: Memulihkan artikel ke isi sebuah revisi
      description: |
        Judul, isi, kategori, tag, dan sampul dikembalikan; status tidak
        berubah. Pemulihan tercatat sebagai revisi baru, jadi bisa dibatalkan.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Revision"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/articles/{id}/comments:
    get:
      operationId: listComments
      tags: [Komentar]
      summary: Komentar sebuah artikel, dari yang terlama
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Comment" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createComment
      tags: [Komentar]
      summary: Berkomentar (semua role, hanya di artikel yang sudah terbit)
      description: |
        Aturan anti-spam: paling banyak 2 tautan, tidak seluruhnya huruf
        kapital, komentar yang sama persis dalam 10 menit ditolak (409), dan
        tiap akun dibatasi `COMMENT_RATE_LIMIT` komentar per menit (429).
        Bila verifikasi email diwajibkan, akun yang belum terverifikasi
        ditolak dengan 403 `email_not_verified`.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentRequest" }
      responses:
        "201":
          description: Dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/comments/{id}/report:
    post:
      operationId: reportComment
      tags: [Komentar]
      summary: Melaporkan komentar
      description: |
        Satu laporan per akun per komentar; laporan ulang tidak menambah
        hitungan. Komentar sendiri tidak bisa dilaporkan. Bila laporan dari akun
        berbeda mencapai `COMMENT_HIDE_THRESHOLD` (bawaan 3), komentar
        disembunyikan otomatis sampai admin meninjaunya.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [spam, abusive, other] }
      responses:
        "200":
          description: Laporan tercatat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      reported: { type: boolean }
                      hidden: { type: boolean, description: Komentar kini disembunyikan }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/moderation/comments:
    get:
      operationId: listReportedComments
      tags: [Komentar]
      summary: Antrean moderasi (admin)
      description: Komentar yang dilaporkan atau disembunyikan, dari yang paling banyak dilaporkan.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ReportedComment" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/moderation/comments/{id}:
    post:
      operationId: moderateComment
      tags: [Komentar]
      summary: Meninjau komentar (admin)
      description: |
        `approve` menampilkan kembali komentar dan menghapus laporannya.
        `hide` menyembunyikan komentar dari publik. Untuk menghapus permanen,
        pakai DELETE /api/v1/comments/{id}.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, hide] }
      responses:
        "204": { description: Berhasil }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/comments/{id}:
    patch:
      operationId: updateComment
      tags: [Komentar]
      summary: Mengubah komentar (hanya penulisnya)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      operationId: deleteComment
      tags: [Komentar]
      summary: Menghapus komentar (penulisnya atau admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Dihapus }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    IdOrSlug:
      name: id
      in: path
      required: true
      description: Id (angka) atau slug. Slug tidak pernah seluruhnya angka.
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      description: Nilai di atas `MAX_PER_PAGE` dipangkas.
      schema: { type: integer, minimum: 1, default: 10 }
    Search:
      name: q
      in: query
      description: |
        Cari di judul dan isi, tidak peka huruf besar. Semua kata harus ada,
        dan kata yang belum lengkap juga cocok ("golan" menemukan "golang").
        Hasil membawa field snippet berisi potongan isi di sekitar kata itu.
      schema: { type: string }
    CategoryFilter:
      name: category
      in: query
      description: Slug kategori
      schema: { type: string }
    TagFilter:
      name: tag
      in: query
      description: Slug tag
      schema: { type: string }
    Sort:
      name: sort
      in: query
      description: |
        popular menimbang jumlah dibaca, suka (x5), dan komentar (x3).
        relevance (bawaan bila ada `q`) mengurutkan menurut kecocokan kata
        kunci, dengan kecocokan di judul berbobot tiga kali.
      schema: { type: string, enum: [relevance, newest, oldest, title, updated, popular] }
    Revision:
      name: revision
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }

  responses:
    BadRequest:
      description: Parameter atau body tidak bisa dibaca
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Token tidak ada, tidak valid, atau kedaluwarsa
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Role atau kepemilikan tidak mengizinkan aksi ini
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Tidak ditemukan
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Bentrok dengan data yang disimpan bersamaan
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    PayloadTooLarge:
      description: Body lebih dari 1 MB
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationFailed:
      description: Validasi gagal, rinciannya per field di `error.fields`
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            error:
              code: validation_failed
              message: validasi gagal
              fields:
                title: title minimal 20 karakter
    TooManyRequests:
      description: Terlalu banyak percobaan dari IP yang sama
      headers:
        Retry-After:
          description: Detik sampai boleh mencoba lagi
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    Readiness:
      type: object
      properties:
        status: { type: string, enum: [ok, unavailable] }
        database: { type: string, example: terhubung }
        redis: { type: string, example: terhubung }
        storage: { type: string, example: terhubung }
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - bad_request
                - unauthorized
                - forbidden
                - email_not_verified
                - not_found
                - method_not_allowed
                - conflict
                - payload_too_large
                - validation_failed
                - too_many_requests
                - internal_error
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer, format: int64 }
        total_pages: { type: integer }

    Role:
      type: string
      enum: [admin, author, reader]
    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        email_verified: { type: boolean }
        bio: { type: string, maxLength: 300 }
        avatar_url: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Author:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        avatar_url: { type: string, nullable: true }
    AuthorProfile:
      type: object
      description: Angka hanya menghitung artikel yang sudah terbit.
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        bio: { type: string }
        avatar_url: { type: string, nullable: true }
        role: { $ref: "#/components/schemas/Role" }
        joined_at: { type: string, format: date-time }
        article_count: { type: integer }
        follower_count: { type: integer }
        view_count: { type: integer }
        like_count: { type: integer }
        following: { type: boolean, description: Selalu false bila belum login }
    FollowState:
      type: object
      properties:
        following: { type: boolean }
        follower_count: { type: integer }
    RevisionSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        editor:
          type: object
          nullable: true
          description: null bila akun penyunting sudah dihapus
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
        characters: { type: integer, description: Panjang isi }
        created_at: { type: string, format: date-time }
    Revision:
      allOf:
        - $ref: "#/components/schemas/RevisionSummary"
        - type: object
          properties:
            content: { type: string }
            category_id: { type: integer, format: int64, nullable: true, description: null bila kategorinya sudah dihapus }
            tags:
              type: array
              items: { type: string }
            cover_image: { type: string, nullable: true }
    Suggestions:
      type: object
      properties:
        articles:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              slug: { type: string }
              title: { type: string }
              category: { type: string }
        categories:
          type: array
          items: { $ref: "#/components/schemas/CategoryRef" }
        tags:
          type: array
          items: { $ref: "#/components/schemas/TagRef" }
        authors:
          type: array
          items: { $ref: "#/components/schemas/Author" }
    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, description: Umur access token dalam detik }
        refresh_token: { type: string }
        user: { $ref: "#/components/schemas/User" }

    Category:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        article_count: { type: integer, description: Jumlah artikel terbit }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CategoryRef:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
    Tag:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        article_count: { type: integer, description: Jumlah artikel terbit }
        created_at: { type: string, format: date-time }
    TagRef:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }

    ArticleStatus:
      type: string
      description: scheduled terbit otomatis pada scheduled_at; sampai saat itu hanya terlihat oleh penulis dan admin.
      enum: [draft, scheduled, published, archived]
    ArticleSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        slug: { type: string }
        excerpt: { type: string }
        status: { $ref: "#/components/schemas/ArticleStatus" }
        author: { $ref: "#/components/schemas/Author" }
        category: { $ref: "#/components/schemas/CategoryRef" }
        tags:
          type: array
          items: { $ref: "#/components/schemas/TagRef" }
        cover_image:
          type: string
          nullable: true
          description: Path gambar sampul, misalnya /uploads/3f2a....webp
        comment_count: { type: integer }
        like_count: { type: integer }
        view_count: { type: integer }
        reading_minutes: { type: integer, description: Perkiraan lama membaca }
        published_at:
          type: string
          format: date-time
          nullable: true
          description: Waktu pertama kali terbit
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          description: Waktu terbit otomatis, hanya untuk status scheduled
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        snippet:
          type: string
          description: Hanya di hasil pencarian (q), potongan isi di sekitar kata yang dicari
    Article:
      allOf:
        - $ref: "#/components/schemas/ArticleSummary"
        - type: object
          properties:
            content: { type: string, description: Isi dalam format Markdown }
            liked: { type: boolean, description: Selalu false bila belum login }
            bookmarked: { type: boolean, description: Selalu false bila belum login }
    Engagement:
      type: object
      properties:
        liked: { type: boolean }
        bookmarked: { type: boolean }
        like_count: { type: integer }
    Stats:
      type: object
      properties:
        scope: { type: string, enum: [all, mine], description: "all untuk admin, mine untuk author" }
        days: { type: integer }
        totals:
          type: object
          properties:
            articles: { type: integer }
            published: { type: integer }
            draft: { type: integer }
            scheduled: { type: integer }
            archived: { type: integer }
            views: { type: integer }
            likes: { type: integer }
            comments: { type: integer }
            bookmarks: { type: integer }
            followers: { type: integer, description: "Pengikut penulis; untuk admin, semua relasi ikuti" }
        users:
          type: object
          description: Jumlah akun per role, hanya untuk admin
          additionalProperties: { type: integer }
        daily:
          type: array
          description: Satu baris per hari (UTC), termasuk hari tanpa aktivitas
          items:
            type: object
            properties:
              date: { type: string, format: date }
              views: { type: integer }
              comments: { type: integer }
              published: { type: integer }
        top_articles:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              title: { type: string }
              slug: { type: string }
              views: { type: integer }
              likes: { type: integer }
              comments: { type: integer }
    ReportedComment:
      allOf:
        - $ref: "#/components/schemas/Comment"
        - type: object
          properties:
            article:
              type: object
              properties:
                id: { type: integer, format: int64 }
                title: { type: string }
                slug: { type: string }
            hidden: { type: boolean }
            reports: { type: integer }
            reasons:
              type: object
              properties:
                spam: { type: integer }
                abusive: { type: integer }
                other: { type: integer }
            last_reported_at: { type: string, format: date-time, nullable: true }
    Comment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        article_id: { type: integer, format: int64 }
        body: { type: string }
        author: { $ref: "#/components/schemas/Author" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email, maxLength: 191 }
        password: { type: string, minLength: 8, description: Maksimal 72 byte }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token: { type: string }
        new_password: { type: string, minLength: 8, description: Maksimal 72 byte }
    UpdateProfileRequest:
      type: object
      description: Semua field opsional.
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        bio: { type: string, maxLength: 300 }
        avatar_url: { type: string, description: "Path hasil upload, atau string kosong untuk menghapus" }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8 }
    UpdateRoleRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
    CategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 3, maxLength: 100 }
        description: { type: string, maxLength: 255 }
    TagRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 50 }
    ArticleRequest:
      type: object
      required: [title, content, category_id, status]
      properties:
        title: { type: string, minLength: 20, maxLength: 200 }
        content: { type: string, minLength: 200, maxLength: 100000, description: Markdown }
        category_id: { type: integer, format: int64 }
        cover_image:
          type: string
          description: Path hasil POST /api/v1/uploads. Kosong berarti tanpa sampul.
        tags:
          type: array
          maxItems: 10
          items: { type: string, minLength: 2, maxLength: 50 }
        status: { $ref: "#/components/schemas/ArticleStatus" }
        scheduled_at:
          type: string
          format: date-time
          description: Wajib untuk status scheduled, di masa depan dan paling jauh setahun
      example:
        title: Panduan Membangun REST API dengan Golang
        content: >-
          Artikel ini membahas cara menyusun REST API dengan Go dari nol: menata
          struktur folder, memisahkan handler, service, dan repository, menulis
          migrasi database, sampai menguji endpoint secara end-to-end dengan MySQL.
        category_id: 1
        tags: [golang, backend]
        status: draft
    ArticlePatch:
      type: object
      description: Semua field opsional; aturannya sama dengan ArticleRequest.
      properties:
        title: { type: string }
        content: { type: string }
        category_id: { type: integer, format: int64 }
        tags:
          type: array
          items: { type: string }
        status: { $ref: "#/components/schemas/ArticleStatus" }
        cover_image: { type: string }
        scheduled_at: { type: string, format: date-time }
    CommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }

    TokenEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/TokenPair" }
    UserEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/User" }
    CategoryEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Category" }
    TagEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Tag" }
    ArticleEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Article" }
    ArticleListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ArticleSummary" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
    CommentEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Comment" }
